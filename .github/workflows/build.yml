name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build Animax.exe
        run: python -m PyInstaller --noconfirm --clean Animax.spec --distpath dist-exe --workpath build

      - name: Prepare installer inputs
        shell: pwsh
        run: Copy-Item dist-exe\Animax.exe Animax.exe -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: python build_installer.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Animax-windows
          path: |
            dist-exe/Animax.exe
            dist/*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-exe/Animax.exe
            dist/*.exe
